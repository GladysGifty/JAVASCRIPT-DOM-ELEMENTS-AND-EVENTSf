
<!DOCTYPE html>
<html>
<head>
    <title>BMI Calculator</title>
    <style>
        body {
            background-color: #e6e6fa;
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }
        .container {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }
        h2 { color: #663399; }
        input {
            padding: 10px;
            margin: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }
        button {
            background-color: #663399;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background-color: #45216b; }
        #score, #type {
            color: #4b0082;
            font-weight: bold;
        }
        .result {
            background-color: #f0e6ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>BMI Calculator</h2>

        Weight (kg):
        <input type="text" id="weight" placeholder="Enter weight"><br>

        Height (m):
        <input type="text" id="height" placeholder="Enter height"><br>

        <button onclick="calculate()">Get BMI!</button>

        <div class="result">
            Your BMI is <span id="score"></span><br>
            Your body type is <span id="type"></span>
        </div>
    </div>

    <script>
        function calculate() {
            var weight = parseFloat(document.getElementById("weight").value);
            var height = parseFloat(document.getElementById("height").value);

            var bmi = weight / (height * height);

            document.getElementById("score").innerHTML = bmi.toFixed(2);

            if (bmi < 18) {
                document.getElementById("type").innerHTML = "Underweight";
            }
            else if (bmi <= 25) {
                document.getElementById("type").innerHTML = "Normal";
            }
            else if (bmi <= 30) {
                document.getElementById("type").innerHTML = "Overweight";
            }
            else {
                document.getElementById("type").innerHTML = "Obese";
            }
        }
    </script>
</body>
</html>
